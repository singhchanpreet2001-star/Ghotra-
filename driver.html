<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ghotra Chauffeur</title>
<meta name="theme-color" content="#0d9466">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chauffeur">
<link rel="manifest" href="/manifest-chauffeur.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
.dwrap{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.dtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.dtop h1{font-family:var(--f-head);font-size:20px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none;font-size:20px}
.ridecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;color:inherit}
.ridecard .route{font-family:var(--f-head);font-size:20px;font-weight:800}
.ridecard.cur{border:2px solid var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13.5px}
.sticky-act{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sticky-act .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px;cursor:pointer}
.fullmap{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.fullmap .map{flex:1;height:auto;border-radius:0;border:0}
.fullmap .bar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.fullmap .next{background:var(--accent);color:var(--on-accent);padding:12px 16px;font-family:var(--f-head);font-size:18px;font-weight:800;display:flex;gap:10px;align-items:center}
.fullmap .next small{font-family:var(--f-mono);font-weight:600;font-size:14px;margin-left:auto;white-space:nowrap}
.fullmap .foot{background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.preview{max-width:100%;max-height:280px;border-radius:12px;border:1px solid var(--line);object-fit:contain;background:var(--sunk)}
</style>
</head>
<body>
<header class="dtop"><span class="logo" aria-hidden="true">G</span><h1 id="hello">Mijn ritten</h1><button class="iconbtn" data-act="menu" aria-label="Menu">☰</button></header>
<main class="dwrap" id="view"><div class="loading"><span class="spin"></span> Ritten laden…</div></main>
<div class="sticky-act" id="act" hidden><div class="inner" id="actInner"></div></div>
<section class="fullmap" id="mapview" hidden></section>
<div id="sheet" hidden><div class="scrim" data-act="close"></div><section class="panel" role="dialog" aria-modal="true" id="panel"></section></div>
<div class="toast" id="toast" hidden></div>
<script src="/assets/driver.js"></script>
</body>
</html>
